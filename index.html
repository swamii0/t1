<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dziennik treningowy</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0B0B0C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dziennik">
<style>
:root{--bg:#F5F4F1;--surf:#FFFFFF;--ink:#121212;--mut:#85857F;--line:#E6E4DF;--acc:#141414;--accink:#FFFFFF;--pr:#B58A3C;--glass:rgba(245,244,241,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0C;--surf:#141416;--ink:#F1EEE8;--mut:#8C8A85;--line:#242427;--acc:#DCCBAE;--accink:#0B0B0C;--pr:#FFFFFF;--glass:rgba(11,11,12,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0C;--surf:#141416;--ink:#F1EEE8;--mut:#8C8A85;--line:#242427;--acc:#DCCBAE;--accink:#0B0B0C;--pr:#FFFFFF;--glass:rgba(11,11,12,.8);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,-apple-system,"SF Pro Display","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:2px 0 22px}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.sub{margin:8px 0 0;color:var(--mut);font-size:14px}.sub::first-letter{text-transform:uppercase}.sub:empty{display:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px}
.hint{color:var(--mut);margin:0 0 12px;font-size:14px}
.empty{text-align:center;padding:56px 12px;color:var(--mut)}.empty h2{color:var(--ink);margin-bottom:8px}.empty p{margin:0 0 22px}
.toast{background:var(--pr);color:#14110A;font-weight:600;border-radius:14px;padding:12px 16px;margin:0 0 14px;animation:up .35s both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{font:500 14px inherit;font-family:inherit;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer;transition:all .2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.set{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.set .n{width:22px;color:var(--mut)}.set b{font-weight:500;flex:1}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--mut);font-size:24px;cursor:pointer;margin-left:auto}
.add{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:end}.add .btn{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
input,select{font:500 20px inherit;font-family:inherit;font-variant-numeric:tabular-nums;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ink);outline:0}
.btn{font:600 16px inherit;font-family:inherit;min-height:52px;padding:0 22px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn.wide{width:100%}
.ghost{font:500 14px inherit;font-family:inherit;min-height:44px;padding:0 8px;border:0;background:none;color:var(--mut);cursor:pointer;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;margin:0 0 6px}.row:last-child{margin:12px 0 0}
.ttl{font-size:20px;font-weight:600;border:0;background:none;padding:0}
.sel{margin:0 0 16px}
svg{display:block}.card>svg{width:100%;height:auto}
.ax{fill:var(--mut);font:12px ui-sans-serif,system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stats span,.stats small{font-size:12px;color:var(--mut)}
.stats b{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.who{display:flex;gap:16px;align-items:flex-end;margin:0 0 20px}.nm{flex:1}
.av{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--mut);font-size:34px;font-weight:600;overflow:hidden;padding:0;cursor:pointer;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:8px 8px env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:120px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--mut);font:500 11px inherit;font-family:inherit;cursor:pointer;transition:color .25s}
nav svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
nav button::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(0);transition:all .25s}
nav button.on{color:var(--ink)}nav button.on svg{transform:translateY(-2px) scale(1.08)}nav button.on::after{opacity:1;transform:scale(1)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
#app.in>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#app.in>*:nth-child(n+2){animation-delay:.06s}#app.in>*:nth-child(n+3){animation-delay:.12s}#app.in>*:nth-child(n+4){animation-delay:.18s}#app.in>*:nth-child(n+5){animation-delay:.24s}
.ln{stroke-dasharray:1}#app.in .ln{stroke-dashoffset:1;animation:dr 1.1s .2s ease forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#app.in .ln{stroke-dashoffset:0!important}}
@media (max-width:400px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main><p id="sub" class="sub"></p><h1 id="h"></h1><div id="app"></div></main>
<nav><button data-t="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Trening</button><button data-t="p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</button><button data-t="g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Postępy</button><button data-t="u"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button></nav>
<script>
const $=s=>document.querySelector(s),KEY='dziennik-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>d.slice(8)+'.'+d.slice(5,7);
const wk=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
let S={plan:[],log:[],upd:0,prof:{}};
let V={tab:'t',day:0,ex:'',range:30,met:'w',msg:''};
try{const t=localStorage.getItem(KEY);if(t)S=JSON.parse(t)}catch(e){}
S.prof=S.prof||{};if(!S.log.length&&JSON.stringify(S.plan.map(d=>d.n))==='["Trening A","Trening B"]')S.plan=[];
const empty=(t,p,b,at)=>`<div class="empty"><h2>${t}</h2><p>${p}</p><button class="btn" ${at}>${b}</button></div>`;
let dbDoc=null,tm;
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
clearTimeout(tm);tm=setTimeout(()=>{if(dbDoc)dbDoc.set(S).catch(()=>{})},600)}
const allEx=()=>[...new Set([...S.plan.flatMap(d=>d.e),...S.log.map(l=>l[1])])];
function last(ex){const t=iso(new Date()),r=S.log.filter(l=>l[1]===ex&&l[0]<t);if(!r.length)return null;
const d=r.reduce((a,l)=>l[0]>a?l[0]:a,'');return{d,s:r.filter(l=>l[0]===d)}}
function vTrain(){
if(!S.plan.length)return empty('Zacznij od planu','Dodaj swoje dni treningowe i ćwiczenia, a potem zapisuj tu serie.','Utwórz plan','data-t="p"');
V.day=Math.min(V.day,S.plan.length-1);const day=S.plan[V.day],t=iso(new Date());
let h='<div class="chips">'+S.plan.map((d,i)=>`<button class="chip${i===V.day?' on':''}" data-a="day" data-i="${i}">${esc(d.n)}</button>`).join('')+'</div>';
if(V.msg)h+=`<p class="toast" role="status">${esc(V.msg)}</p>`;
if(!day.e.length)return h+empty('Brak ćwiczeń','Dodaj ćwiczenia do tego dnia w planie.','Edytuj plan','data-t="p"');
day.e.forEach((ex,i)=>{const L=last(ex),td=S.log.map((l,k)=>[l,k]).filter(([l])=>l[0]===t&&l[1]===ex);
const ref=td.length?td[td.length-1][0]:(L?L.s[L.s.length-1]:null);
h+=`<section class="card"><h2>${esc(ex)}</h2>`;
h+=L?`<p class="hint">Ostatnio (${fd(L.d)}): ${L.s.map(l=>l[3]+'×'+l[2]+' kg').join(', ')}</p>`:'<p class="hint">Brak wcześniejszych wyników.</p>';
td.forEach(([l,k],j)=>{h+=`<div class="set"><span class="n">${j+1}</span><b>${l[2]} kg</b><b>${l[3]} powt.</b><button class="x" data-a="del" data-k="${k}" aria-label="Usuń serię">×</button></div>`});
h+=`<div class="add"><label>Ciężar (kg)<input inputmode="decimal" id="w${i}" value="${ref?ref[2]:''}"></label><label>Powtórzenia<input inputmode="numeric" id="r${i}" value="${ref?ref[3]:''}"></label><button class="btn" data-a="add" data-i="${i}">Dodaj serię</button></div></section>`});
return h}
function add(i){const ex=S.plan[V.day].e[i],w=parseFloat(String($('#w'+i).value).replace(',','.')),r=parseInt($('#r'+i).value);
if(!(w>=0)||!(r>0)){V.msg='Wpisz ciężar i liczbę powtórzeń.';return render()}
const had=S.log.some(l=>l[1]===ex),prev=Math.max(0,...S.log.filter(l=>l[1]===ex).map(l=>l[2]));
S.log.push([iso(new Date()),ex,w,r]);V.msg=had&&w>prev?'Nowy rekord ciężaru: '+w+' kg':'';save();render()}
function vPlan(){
if(!S.plan.length)return empty('Twój plan jest pusty','Utwórz pierwszy dzień treningowy, np. Push, Pull albo Nogi.','Dodaj dzień','data-a="ad"');
let h='';
S.plan.forEach((d,i)=>{h+=`<section class="card"><div class="row"><input class="ttl" data-a="rn" data-i="${i}" value="${esc(d.n)}" aria-label="Nazwa dnia"><button class="ghost" data-a="rd" data-i="${i}">Usuń dzień</button></div>`;
d.e.forEach((e,j)=>{h+=`<div class="set"><b>${esc(e)}</b><button class="x" data-a="re" data-i="${i}" data-j="${j}" aria-label="Usuń ćwiczenie">×</button></div>`});
h+=`<div class="row"><input id="ne${i}" placeholder="Nazwa ćwiczenia" aria-label="Nowe ćwiczenie"><button class="btn" data-a="ae" data-i="${i}">Dodaj</button></div></section>`});
return h+'<button class="btn alt wide" data-a="ad">Dodaj dzień treningowy</button>'}
function series(){const n=V.range,cut=iso(new Date(Date.now()-n*864e5)),g={};
S.log.filter(l=>l[1]===V.ex&&l[0]>=cut).forEach(l=>{const k=n>180?wk(l[0]):l[0];(g[k]=g[k]||[]).push(l)});
return Object.keys(g).sort().map(k=>{const a=g[k],v=V.met==='w'?Math.max(...a.map(l=>l[2])):V.met==='r'?Math.max(...a.map(l=>l[3])):a.reduce((s,l)=>s+l[2]*l[3],0);return{k,v:Math.round(v*10)/10}})}
function chart(s){
if(!s.length)return'<p class="empty">Brak serii w tym okresie. Zapisz trening, a wykres pojawi się tutaj.</p>';
const W=640,H=230,L=44,R=14,T=16,B=28,vs=s.map(x=>x.v);let lo=Math.min(...vs),hi=Math.max(...vs);
if(lo===hi){lo-=1;hi+=1}const p=(hi-lo)*.12;lo=Math.max(0,lo-p);hi+=p;
const X=i=>L+(s.length===1?(W-L-R)/2:i*(W-L-R)/(s.length-1)),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),best=Math.max(...vs);
let g='';[0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${Math.round(v*10)/10}</text>`});
return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres postępów">${g}<polyline class="ln" pathLength="1" points="${s.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${s.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${x.v===best?6:3.5}" fill="${x.v===best?'var(--pr)':'var(--acc)'}" stroke="var(--surf)" stroke-width="1.5"/>`).join('')}<text x="${L}" y="${H-8}" class="ax">${fd(s[0].k)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" class="ax">${fd(s[s.length-1].k)}</text></svg>`}
function vProg(){const ex=allEx();
if(!ex.length)return'<p class="empty">Dodaj ćwiczenia w planie i zapisz pierwszy trening.</p>';
if(!ex.includes(V.ex))V.ex=ex[0];
const s=series(),u={w:' kg',r:' powt.',v:''}[V.met],ch=(a,arr,cur)=>'<div class="chips">'+arr.map(([v,n])=>`<button class="chip${v===cur?' on':''}" data-a="${a}" data-v="${v}">${n}</button>`).join('')+'</div>';
let h=`<label class="sel">Ćwiczenie<select data-a="ex">${ex.map(e=>`<option value="${esc(e)}"${e===V.ex?' selected':''}>${esc(e)}</option>`).join('')}</select></label>`;
h+=ch('rng',[[7,'Tydzień'],[30,'Miesiąc'],[365,'Rok']],V.range)+ch('met',[['w','Ciężar'],['r','Powtórzenia'],['v','Objętość']],V.met);
h+=`<section class="card">${chart(s)}</section>`;
if(s.length){const f=s[0].v,l=s[s.length-1].v,b=s.reduce((a,x)=>x.v>a.v?x:a),d=Math.round((l-f)*10)/10,pc=f?Math.round((l-f)/f*100):0;
h+=`<div class="stats"><div><span>Najlepszy wynik</span><b>${b.v}${u}</b><small>${fd(b.k)}</small></div><div><span>Zmiana w okresie</span><b>${d>0?'+':''}${d}${u}</b><small>${s.length>1?(pc>0?'+':'')+pc+'%':'jeden pomiar'}</small></div><div><span>${V.range>180?'Tygodnie z treningiem':'Dni z treningiem'}</span><b>${s.length}</b></div></div>`}
return h+'<p class="hint" style="margin-top:12px">Objętość to suma ciężar × powtórzenia ze wszystkich serii. Dla roku punkty są łączone tygodniami.</p>'}
function vProf(){const p=S.prof,L=S.log,days=new Set(L.map(l=>l[0])).size,vol=Math.round(L.reduce((a,l)=>a+l[2]*l[3],0)/100)/10,cur=p.theme||'auto',tn={auto:'Auto',light:'Jasny',dark:'Ciemny'};
return`<div class="who"><button class="av" data-a="pf" aria-label="Zmień zdjęcie profilowe">${p.photo?`<img src="${p.photo}" alt="">`:esc((p.name||'+').charAt(0).toUpperCase())}</button><input id="pf" type="file" accept="image/*" hidden><label class="nm">Imię<input data-a="nm" value="${esc(p.name||'')}" placeholder="Jak masz na imię?" maxlength="30"></label></div>
<div class="stats"><div><span>Treningi</span><b>${days}</b></div><div><span>Serie</span><b>${L.length}</b></div><div><span>Objętość</span><b>${vol} t</b></div></div>
<section class="card"><h2>Motyw</h2><div class="chips" style="margin:10px 0 0">${Object.keys(tn).map(v=>`<button class="chip${v===cur?' on':''}" data-a="th" data-v="${v}">${tn[v]}</button>`).join('')}</div></section>
<section class="card"><h2>Kopia zapasowa</h2><p class="hint">Dane są tylko w tym telefonie. Eksportuj plik, żeby ich nie stracić. Import zastępuje obecne dane.</p><div class="row"><button class="btn" data-a="exp">Eksportuj</button><button class="btn alt" data-a="imp">Importuj</button></div><input type="file" id="imp" accept=".json,application/json" hidden></section>`}
function photo(f){const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),n=256,m=Math.min(im.width,im.height);c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);S.prof.photo=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);save();render()};im.src=u}
function render(anim){const a=$('#app'),th=S.prof.theme,nm=S.prof.name;
if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;else delete document.documentElement.dataset.theme;
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));
$('#h').textContent={t:nm?'Cześć, '+nm:'Trening',p:'Plan',g:'Postępy',u:'Profil'}[V.tab];
$('#sub').textContent=V.tab==='t'?new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}):'';
a.classList.remove('in');a.innerHTML={t:vTrain,p:vPlan,g:vProg,u:vProf}[V.tab]();if(anim){void a.offsetWidth;a.classList.add('in')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
if(b.dataset.t){V.tab=b.dataset.t;V.msg='';return render(1)}
const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(a==='add')return add(i);
if(a==='day'){V.day=i;V.msg=''}
else if(a==='del'){S.log.splice(+b.dataset.k,1);V.msg='';save()}
else if(a==='ae'){const n=$('#ne'+i).value.trim();if(n){S.plan[i].e.push(n);save()}}
else if(a==='re'){S.plan[i].e.splice(j,1);save()}
else if(a==='rd'){S.plan.splice(i,1);V.day=0;save()}
else if(a==='ad'){S.plan.push({n:'Nowy dzień',e:[]});save()}
else if(a==='exp'){exportData();return}
else if(a==='imp'){$('#imp').click();return}
else if(a==='rng')V.range=+b.dataset.v;
else if(a==='met')V.met=b.dataset.v;
else if(a==='pf'){$('#pf').click();return}
else if(a==='th'){S.prof.theme=b.dataset.v;save()}
render(a==='day'||a==='rng'||a==='met'?1:0)});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;
if(a==='rn'){S.plan[+t.dataset.i].n=t.value.trim()||'Trening';save()}
else if(a==='ex'){V.ex=t.value;render(1)}
else if(a==='nm'){S.prof.name=t.value.trim();save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='pf'&&e.target.files[0])photo(e.target.files[0])});
render(1);
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;
f.text().then(t=>{const d=JSON.parse(t);if(!(d&&Array.isArray(d.log)&&Array.isArray(d.plan)))throw 0;S={plan:d.plan,log:d.log,prof:d.prof||{},upd:Date.now()};save();V.msg='Zaimportowano dane.';V.tab='t';render()}).catch(()=>{V.msg='Nie udało się zaimportować pliku.';V.tab='t';render()})});
async function exportData(){const n='dziennik-'+iso(new Date())+'.json',f=new File([JSON.stringify(S)],n,{type:'application/json'});
