<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dziennik treningowy</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0B0B0C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dziennik">
<style>
:root{--bg:#F5F4F1;--surf:#FFFFFF;--ink:#121212;--mut:#85857F;--line:#E6E4DF;--acc:#141414;--accink:#FFFFFF;--pr:#B58A3C;--glass:rgba(245,244,241,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0C;--surf:#141416;--ink:#F1EEE8;--mut:#8C8A85;--line:#242427;--acc:#DCCBAE;--accink:#0B0B0C;--pr:#FFFFFF;--glass:rgba(11,11,12,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0C;--surf:#141416;--ink:#F1EEE8;--mut:#8C8A85;--line:#242427;--acc:#DCCBAE;--accink:#0B0B0C;--pr:#FFFFFF;--glass:rgba(11,11,12,.8);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,-apple-system,"SF Pro Display","Helvetica Neue",Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:2px 0 22px}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.sub{margin:8px 0 0;color:var(--mut);font-size:14px}.sub::first-letter{text-transform:uppercase}.sub:empty{display:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px}
.hint{color:var(--mut);margin:0 0 12px;font-size:14px}
.empty{text-align:center;padding:56px 12px;color:var(--mut)}.empty h2{color:var(--ink);margin-bottom:8px}.empty p{margin:0 0 22px}
.toast{background:var(--pr);color:#14110A;font-weight:600;border-radius:14px;padding:12px 16px;margin:0 0 14px;animation:up .35s both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{font:500 14px inherit;font-family:inherit;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer;transition:all .2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.set{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.set .n{width:22px;color:var(--mut)}.set b{font-weight:500;flex:1}
.x{min-width:44px;min-height:44px;border:0;background:none;color:var(--mut);font-size:24px;cursor:pointer;margin-left:auto}
.add{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:end}.add .btn{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
input,select{font:500 20px inherit;font-family:inherit;font-variant-numeric:tabular-nums;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--ink);outline:0}
.btn{font:600 16px inherit;font-family:inherit;min-height:52px;padding:0 22px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn.wide{width:100%}
.ghost{font:500 14px inherit;font-family:inherit;min-height:44px;padding:0 8px;border:0;background:none;color:var(--mut);cursor:pointer;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;margin:0 0 6px}.row:last-child{margin:12px 0 0}
.ttl{font-size:20px;font-weight:600;border:0;background:none;padding:0}
.sel{margin:0 0 16px}
svg{display:block}.card>svg{width:100%;height:auto}
.ax{fill:var(--mut);font:12px ui-sans-serif,system-ui,sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stats span,.stats small{font-size:12px;color:var(--mut)}
.stats b{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.who{display:flex;gap:16px;align-items:flex-end;margin:0 0 20px}.nm{flex:1}
.av{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--mut);font-size:34px;font-weight:600;overflow:hidden;padding:0;cursor:pointer;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:8px 8px env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:120px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--mut);font:500 11px inherit;font-family:inherit;cursor:pointer;transition:color .25s}
nav svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
nav button::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(0);transition:all .25s}
nav button.on{color:var(--ink)}nav button.on svg{transform:translateY(-2px) scale(1.08)}nav button.on::after{opacity:1;transform:scale(1)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dr{to{stroke-dashoffset:0}}
#app.in>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#app.in>*:nth-child(n+2){animation-delay:.06s}#app.in>*:nth-child(n+3){animation-delay:.12s}#app.in>*:nth-child(n+4){animation-delay:.18s}#app.in>*:nth-child(n+5){animation-delay:.24s}
.ln{stroke-dasharray:1}#app.in .ln{stroke-dashoffset:1;animation:dr 1.1s .2s ease forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#app.in .ln{stroke-dashoffset:0!important}}
@media (max-width:400px){.stats{grid-template-columns:1fr}}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 10px}.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.big{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 16px;text-align:center}
.cal b{font-size:11px;font-weight:500;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;border:0;background:none;border-radius:50%;color:var(--ink);font:500 15px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .2s;font-variant-numeric:tabular-nums}
.day em{width:5px;height:5px;border-radius:50%;border:1px solid var(--mut);display:block}.day em.ok{background:var(--pr);border-color:var(--pr)}
.day.td{box-shadow:inset 0 0 0 1px var(--mut)}.day.sel{background:var(--ink);color:var(--bg)}.day.sel em{border-color:var(--bg)}.day.sel em.ok{background:var(--bg)}
.mh{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}.mh h2{text-transform:capitalize}.mh .ghost{font-size:26px;min-width:44px}
.done{color:var(--pr);font-weight:600;margin:0 0 10px}
main{position:relative}
.gear{position:absolute;top:18px;right:14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:50%;transition:transform .4s cubic-bezier(.2,.8,.2,1)}.gear:active{transform:rotate(60deg)}.gear svg{width:24px;height:24px}.gear[hidden]{display:none}
.sub .ghost{margin-left:-8px;font-size:16px;color:var(--ink)}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:0 0 12px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,border-color .2s}.tile:active{transform:scale(.985)}
.ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center}.ico svg{width:26px;height:26px}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.tx b{font-size:18px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx small{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mut);font-size:22px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.ib{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}.ib svg{width:24px;height:24px}.ib.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wkh{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.wkh h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}.wkh .ghost{font-size:28px;min-width:48px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 20px}
.wd{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:16px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer;transition:all .2s;font-variant-numeric:tabular-nums}
.wd small{font-size:11px;color:var(--mut)}.wd b{font-size:18px;font-weight:600}
.wd em{width:5px;height:5px;border-radius:50%;border:1px solid var(--mut);display:block}.wd em.ok{background:var(--pr);border-color:var(--pr)}.wd em.rs{border-radius:2px;height:2px;width:8px;border:0;background:var(--mut)}.wd em.no{visibility:hidden}
.wd.td{border-color:var(--mut)}.wd.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}.wd.sel small{color:var(--bg);opacity:.7}.wd.sel em{border-color:var(--bg)}.wd.sel em.ok,.wd.sel em.rs{background:var(--bg)}
.dl{margin:0 0 12px;color:var(--mut);font-size:14px}.dl::first-letter{text-transform:uppercase}
.pk{margin:14px 0 4px}
.item{background:var(--surf);border:1px solid var(--line);border-radius:20px;margin:12px 0 0;overflow:hidden}
.ih{display:flex;align-items:center;gap:12px;padding:12px 4px 12px 14px}.ih>.tx{flex:1}
.ib2{flex:1;min-width:0;display:flex;align-items:center;gap:16px;background:none;border:0;padding:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.chev{transition:transform .25s}.chev.up{transform:rotate(90deg)}
.exs{padding:0 16px 12px}
.hello{font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Lucida Handwriting","Brush Script MT",cursive;font-size:clamp(46px,15vw,68px);line-height:1.2;font-weight:400;letter-spacing:0;margin:4px 0 22px;padding:2px 8px 10px 0;background:linear-gradient(100deg,var(--ink) 40%,var(--mut) 52%,var(--ink) 64%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow-wrap:anywhere}
@keyframes wr{from{clip-path:inset(-15% 100% -15% 0);filter:blur(7px);opacity:.3}to{clip-path:inset(-15% 0 -15% 0);filter:blur(0);opacity:1}}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
#app.in .hello{animation:wr 2s cubic-bezier(.55,.05,.2,1) both,shim 2.6s .5s ease-out both}
#app.in>.after{animation-delay:1s}
.tm{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.tr{display:flex;align-items:center;gap:4px}
.clk{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.clk.off{opacity:.4}
.sb{flex:1;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.sb b{font-weight:500}
.pen{font-style:normal;font-size:12px;color:var(--mut);margin-left:auto}
.ed{gap:8px}.ed input{min-height:44px;font-size:17px;padding:0 10px;flex:1;min-width:0}
</style>
</head>

<nav><button data-t="p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutyny</button><button data-t="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Kalendarz</button><button data-t="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Trening</button><button data-t="g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Postępy</button><button data-t="u"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button></nav>
<script>
const $=s=>document.querySelector(s),KEY='dziennik-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>d.slice(8)+'.'+d.slice(5,7);
const wk=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
let S={plan:[],log:[],upd:0,prof:{}};
let V={tab:'t',day:0,ex:'',range:30,met:'w',msg:'',set:0,rt:null,tp:null,ed:-1,wk:(()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d})(),pick:0,ox:'',cd:iso(new Date())};
try{const t=localStorage.getItem(KEY);if(t)S=JSON.parse(t)}catch(e){}
S.prof=S.prof||{};if(!S.log.length&&JSON.stringify(S.plan.map(d=>d.n))==='["Trening A","Trening B"]')S.plan=[];
const uid=()=>Math.random().toString(36).slice(2,9);
const mig=()=>{S.prof=S.prof||{};S.sched=S.sched||{};S.done=S.done||{};S.dur=S.dur||{};for(const k in S.done)if(!Array.isArray(S.done[k]))S.done[k]=[S.done[k]];for(const k in S.sched)if(!Array.isArray(S.sched[k]))S.sched[k]=[S.sched[k]];S.plan.forEach(d=>{d.id=d.id||uid();d.ic=d.ic||'dumb';d.ds=d.ds||''})};mig();
const rt=id=>S.plan.find(d=>d.id===id),sd=k=>S.sched[k]||[];
const F=()=>S.prof.units==='imperial'?2.20462262:1,U=()=>S.prof.units==='imperial'?'lb':'kg',dw=k=>Math.round(k*F()*10)/10,kgIn=v=>Math.round(v/F()*1000)/1000;
const tk=()=>{const a=S.act;if(!a)return;const n=Date.now();if(a.run){a.ms=(a.ms||0)+Math.min(n,(a.last||n)+18e5)-a.run;a.run=n}a.last=n};
const el=a=>(a.ms||0)+(a.run?Math.min(Date.now(),(a.last||Date.now())+18e5)-a.run:0);
const fmtC=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),c=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')};
const fin=()=>{tk();S.dur[S.act.date]=(S.dur[S.act.date]||0)+(S.act.ms||0);S.act=null};
const fmtT=ms=>{const m=Math.round(ms/6e4);return m<60?m+' min':Math.floor(m/60)+' h '+m%60+' min'};
const empty=(t,p,b,at)=>`<div class="empty"><h2>${t}</h2><p>${p}</p><button class="btn" ${at}>${b}</button></div>`;
let dbDoc=null,tm;
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
clearTimeout(tm);tm=setTimeout(()=>{if(dbDoc)dbDoc.set(S).catch(()=>{})},600)}
const allEx=()=>[...new Set([...S.plan.flatMap(d=>d.e),...S.log.map(l=>l[1])])];
function last(ex){const t=iso(new Date()),r=S.log.filter(l=>l[1]===ex&&l[0]<t);if(!r.length)return null;
const d=r.reduce((a,l)=>l[0]>a?l[0]:a,'');return{d,s:r.filter(l=>l[0]===d)}}
function vTrain(){
if(S.act)return vAct();
if(V.tp&&rt(V.tp))return vOv();
const t=iso(new Date()),ids=sd(t),rs=ids.includes('rest'),rl=ids.filter(x=>x!=='rest').map(rt).filter(Boolean),nm=S.prof.name,
tl=r=>`<button class="tile" data-a="to" data-id="${r.id}"><span class="ico">${ico(r.ic)}</span><span class="tx"><b>${esc(r.n)}${(S.done[t]||[]).includes(r.id)?' ✓':''}</b><small>${r.e.length} ${pl(r.e.length)}${r.ds?' · '+esc(r.ds):''}</small></span><span class="chev">›</span></button>`;
let h=`<h1 class="hello">Witaj${nm?', '+esc(nm):''}</h1><div class="after">`;
if(V.msg)h+=`<p class="toast" role="status">${esc(V.msg)}</p>`;
if(!S.plan.length)h+=empty('Zacznij od rutyny','Utwórz rutynę, zaplanuj ją w kalendarzu i zacznij trening.','Utwórz rutynę','data-t="p"');
else{h+='<p class="hint">Na dziś</p>';
if(rl.length)h+=rl.map(tl).join('');
else if(rs)h+=`<div class="tile" style="cursor:default"><span class="ico">${rico}</span><span class="tx"><b>Regeneracja</b><small>Dziś dzień odpoczynku</small></span></div>`;
else h+='<div class="empty" style="padding:28px 12px"><h2>Dziś nic nie zaplanowano</h2><p>Zaplanuj trening w kalendarzu albo wybierz rutynę poniżej.</p><button class="btn" data-t="k">Otwórz kalendarz</button></div>';
const ot=S.plan.filter(d=>!rl.includes(d));
if(ot.length)h+='<p class="hint" style="margin-top:20px">Inne rutyny</p><div class="chips">'+ot.map(d=>`<button class="chip" data-a="to" data-id="${d.id}">${esc(d.n)}</button>`).join('')+'</div>'}

else if(a==='nx'){V.ed=-1;tk();const r=rt(S.act.rid);if(r&&S.act.step<r.e.length-1)S.act.step++;else{(S.done[S.act.date]=S.done[S.act.date]||[]).push(S.act.rid);fin();V.msg='Trening ukończony. Dobra robota!'}save()}
else if(a==='pv'){V.ed=-1;tk();S.act.step=Math.max(0,S.act.step-1);save()}
else if(a==='ab'){if(S.log.some(l=>l[0]===S.act.date))fin();else S.act=null;V.msg='';save()}
else if(a==='ro'){V.rt=S.plan[i].id}
else if(a==='ic'){rt(V.rt).ic=b.dataset.v;save()}
else if(a==='set'){V.set=1}
else if(a==='bk'){V.set=0;V.rt=null;V.tp=null}
else if(a==='un'){S.prof.units=b.dataset.v;save()}
else if(a==='cd'){V.cd=b.dataset.k;V.pick=0;V.msg=''}
else if(a==='wm'){V.wk=new Date(V.wk);V.wk.setDate(V.wk.getDate()+7*+b.dataset.v);const t0=iso(new Date()),en=new Date(V.wk);en.setDate(en.getDate()+6);V.cd=t0>=iso(V.wk)&&t0<=iso(en)?t0:iso(V.wk);V.pick=0;V.msg=''}
else if(a==='pk'){V.pick=!V.pick;V.msg=''}
else if(a==='ap'){const id=b.dataset.id;let l=sd(V.cd).filter(x=>x!=='rest');if(id==='rest')l=['rest'];else if(!l.includes(id))l.push(id);S.sched[V.cd]=l;V.pick=0;save()}
else if(a==='tr'){const l=sd(V.cd).filter(x=>x!==b.dataset.id);if(l.length)S.sched[V.cd]=l;else delete S.sched[V.cd];save()}
else if(a==='tx'){V.ox=V.ox===b.dataset.key?'':b.dataset.key}
else if(a==='rp'){const id=b.dataset.id,base=new Date(V.cd+'T00:00');for(let n=1;n<=12;n++){const d=new Date(base);d.setDate(d.getDate()+7*n);const k2=iso(d),l=sd(k2).filter(x=>x!=='rest');if(!l.includes(id))l.push(id);S.sched[k2]=l}V.msg='Powtórzono co tydzień przez 12 tygodni.';save()}
else if(a==='to'){V.tp=b.dataset.id;V.msg=''}
else if(a==='pz'){tk();S.act.run=S.act.run?null:Date.now();save()}
else if(a==='ed'){V.ed=+b.dataset.k}
else if(a==='sv'){const w=parseFloat(String($('#ew').value).replace(',','.')),q=parseInt($('#er').value),k=+b.dataset.k;if(w>=0&&q>0){tk();S.log[k][2]=kgIn(w);S.log[k][3]=q;V.ed=-1;V.msg='';save()}else V.msg='Wpisz ciężar i liczbę powtórzeń.'}
else if(a==='pf'){$('#pf').click();return}
else if(a==='th'){S.prof.theme=b.dataset.v;save()}
render(['rng','met','go','nx','pv','ab','set','bk','ro','ad','wm','to'].includes(a)?1:0)});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;
if(a==='rn'){rt(V.rt).n=t.value.trim()||'Rutyna';save();render()}
else if(a==='rs'){rt(V.rt).ds=t.value.trim();save()}
else if(a==='ex'){V.ex=t.value;render(1)}
else if(a==='nm'){S.prof.name=t.value.trim();save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='pf'&&e.target.files[0])photo(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ne')){e.preventDefault();e.target.nextElementSibling.click()}});
setInterval(()=>{const c=$('#clk');if(c&&S.act&&V.tab==='t')c.textContent=fmtC(el(S.act))},1000);
render(1);
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;
f.text().then(t=>{const d=JSON.parse(t);if(!(d&&Array.isArray(d.log)&&Array.isArray(d.plan)))throw 0;S={plan:d.plan,log:d.log,prof:d.prof||{},sched:d.sched||{},done:d.done||{},dur:d.dur||{},upd:Date.now()};mig();save();V.msg='Zaimportowano dane.';V.tab='t';render()}).catch(()=>{V.msg='Nie udało się zaimportować pliku.';V.tab='t';render()})});
async function exportData(){const n='dziennik-'+iso(new Date())+'.json',f=new File([JSON.stringify(S)],n,{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e.name==='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
